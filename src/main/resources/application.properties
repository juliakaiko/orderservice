spring.application.name=orderservice
server.port=8082

spring.jackson.serialization.fail-on-empty-beans=false
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------- JPA --------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# -------------------- Outbox --------------------
outbox.processing-timeout-minutes=5
outbox.batch-size=100

# -------------------- OpenAPI --------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# -------------------- Spring Boot Actuator --------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# -------------------- Liquibase --------------------
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# -------------------- Kafka --------------------
kafka.consumer.topics.create-payment=create-payment
kafka.consumer.group-id=order-service-group
kafka.producer.topics.create-order=create-order
spring.kafka.properties.request.timeout.ms=30000
spring.kafka.properties.retry.backoff.ms=1000

# -------------------- Kafka Admin --------------------
spring.kafka.admin.properties.request.timeout.ms=30000
spring.kafka.admin.fail-fast=false

# -------------------- Kafka Producer --------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=1000
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# -------------------- Kafka Consumer --------------------
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.mymicroservices.common.events

# At the first launch, we read everything from the beginning
spring.kafka.consumer.auto-offset-reset=earliest
#spring.kafka.consumer.properties.spring.json.use.type.headers=false

#The message will be considered processed after a manual acknowledgment.acknowledge() call in the code.
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.auto-startup=true
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.retry.backoff.ms=5000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000