user-service.url=http://userservice:8083

# Logging
logging.level.com.mymicroservice.orderservice=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN

# DataBase
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_ORDER_NAME}?sslmode=disable
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Liquibase
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_ORDER_NAME}?sslmode=disable
spring.liquibase.user=${DB_USER}
spring.liquibase.password=${DB_PASSWORD}

# Kafka: docker-compose -f docker-compose.yml up
spring.kafka.bootstrap-servers=kafka:9092

# Limited retries to fail fast in dev
spring.kafka.properties.retries=1000

# Time before consumer is considered dead
spring.kafka.consumer.properties.session.timeout.ms=30000
