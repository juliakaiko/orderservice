spring.application.name=orderservice
spring.liquibase.enabled=false
kafka.consumer.topics.create-payment=create-payment
kafka.consumer.group-id=order-service-group
kafka.producer.topics.create-order=create-order
user-service.url=http://localhost:8089

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.test.database.replace=none
