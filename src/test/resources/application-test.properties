spring.application.name=orderservice
kafka.consumer.topics.create-payment=create-payment
kafka.consumer.group-id=order-service-group
kafka.producer.topics.create-order=create-order
spring.liquibase.enabled=false

user-service.url=http://localhost:8089
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:tc:postgresql:15-alpine:///testdb
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
testcontainers.reuse.enable=true
testcontainers.ryuk.disabled=true

spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

logging.level.testcontainers=WARN
logging.level.org.testcontainers=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.com.zaxxer.hikari=WARN

logging.level.org.springframework.cloud.openfeign=WARN
logging.level.feign=WARN